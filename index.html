<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#070a1a" />
<title>Love</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    overflow: hidden;
    background:
      linear-gradient(180deg, rgba(7,10,24,.26) 0%, rgba(6,8,20,.36) 45%, rgba(3,4,12,.62) 100%),
      url("bg.webp") center center / cover no-repeat,
      #05060f;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    overscroll-behavior: none;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #sky { z-index: 1; }
  #heart { z-index: 2; }

  /* ---------- 专属提示卡片 ---------- */
  #cards { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
  .card {
    --rot: 0deg;
    position: absolute;
    aspect-ratio: 2.75 / 1;
    pointer-events: auto;
    transform: rotate(var(--rot));
    animation: cardIn .3s ease-out both;
    will-change: opacity;
  }
  @keyframes cardIn { from { opacity: 0; } to { opacity: 1; } }

  .card-banner {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: fill;
    pointer-events: none;
    filter: drop-shadow(0 12px 22px rgba(0, 0, 0, .45));
  }

  /* 台词写在卷轴中间的纸面上 */
  .card-text {
    position: absolute;
    left: 15%;
    right: 17%;
    top: 20%;
    bottom: 16%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Songti SC", "STSong", "SimSun", serif;
    font-size: clamp(14px, 5.2vw, 20px);
    line-height: 1.3;
    letter-spacing: .02em;
    color: #3b3f4a;
    text-align: center;
    text-shadow: 0 1px 0 rgba(255, 255, 255, .6);
    pointer-events: none;
    overflow: hidden;
  }

  .card .close {
    position: absolute;
    top: 4%;
    right: 3%;
    z-index: 3;
    width: 24px;
    height: 24px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid rgba(90, 100, 116, .35);
    background: rgba(247, 249, 252, .55);
    color: #4a5160;
    font-size: 16px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  /* ---------- 底部 HUD ---------- */
  .hud {
    position: fixed; left: 0; right: 0; z-index: 8;
    bottom: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px;
    pointer-events: none;
  }
  .pill {
    pointer-events: auto;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 14px;
    color: #ffd98f;
    background: rgba(28, 22, 16, .6);
    border: 1px solid rgba(255, 214, 130, .32);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    white-space: nowrap;
  }
  .btn {
    pointer-events: auto;
    padding: 10px 24px;
    border-radius: 999px;
    font-size: 15px;
    font-family: inherit;
    color: #ffd98f;
    background: rgba(24, 18, 14, .65);
    border: 1px solid rgba(255, 214, 130, .45);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    cursor: pointer;
    transition: opacity .3s, transform .2s;
  }
  .btn:active { transform: scale(.94); }
  .btn.hidden { opacity: 0; pointer-events: none; }

  .hint {
    position: fixed; left: 0; right: 0; z-index: 7;
    bottom: 74px;
    bottom: calc(74px + env(safe-area-inset-bottom, 0px));
    text-align: center;
    font-size: 12.5px;
    color: rgba(235, 230, 255, .5);
    letter-spacing: .06em;
    transition: opacity 1s;
    pointer-events: none;
  }
  .hint.hidden { opacity: 0; }

  /* 加载 / 出错提示 */
  #boot {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255, 226, 240, .72);
    font-size: 14px; letter-spacing: .2em;
    background: rgba(4, 6, 16, .32);
    transition: opacity .7s;
    pointer-events: none;
  }
  #boot.hide { opacity: 0; }
  #err {
    position: fixed; left: 12px; right: 12px; bottom: 84px; z-index: 30;
    display: none;
    padding: 10px 12px; border-radius: 10px;
    background: rgba(60, 10, 20, .88); color: #ffd3dd;
    font-size: 12px; line-height: 1.5; word-break: break-all;
  }
  #err.show { display: block; }

  /* 右上角音乐开关 */
  .sound {
    position: fixed; z-index: 9;
    top: 14px;
    top: calc(14px + env(safe-area-inset-top, 0px));
    right: 14px;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(255, 214, 130, .38);
    background: rgba(24, 18, 30, .55);
    color: #ffd98f;
    font-size: 19px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    cursor: pointer;
    transition: opacity .3s, transform .2s, box-shadow .3s;
  }
  .sound:active { transform: scale(.92); }
  .sound:not(.on) { animation: soundPulse 2.4s ease-in-out infinite; }
  @keyframes soundPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 214, 130, .0); }
    50% { box-shadow: 0 0 0 9px rgba(255, 214, 130, .12); }
  }

  @media (max-width: 320px) { .card-text { font-size: 13px; } }

  @media (max-width: 520px) {
    .card-head { padding: 8px 12px; font-size: 12px; }
    .card-body { font-size: 15px; line-height: 1.78; padding: 16px 14px 20px; }
    .pill { font-size: 13px; padding: 9px 15px; }
    .btn { font-size: 14px; padding: 9px 20px; }
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="heart"></canvas>
<div id="cards"></div>
<audio id="bgm" loop preload="none" playsinline src="bgm.mp3"></audio>
<div id="boot">正在点亮星光…</div>
<div id="err"></div>

<div class="hint" id="hint">点右下角「结束」停止</div>
<div class="hud">
  <div class="pill" id="counter">故事进行中 · 0/50</div>
  <button class="btn" id="stop">结束</button>
</div>

<button class="sound" id="sound" aria-label="开启背景音乐">🎵</button>

<script>
'use strict';

/* ============================================================
 * 0. 配置：名字、流星数量、卡片文案都在这里改
 * ============================================================ */
const CONFIG = {
  name: '素素',           // 换成对方的名字
  total: 50,              // 流星雨总共多少颗
  cardLimit: 5,           // 屏幕上最多同时堆几张卡
  messages: [
    '我们逃走 不要被命运找到。',
    '当我感到脆弱的时候就重复你的名字',
    '淮朝、淮朝',
    '我们会一起回家',
    '我们会一起回到二十一世纪',
    '祈愿 淮朝 所愿皆成真',
   '淮朝 我不害怕你',
   '我爱你 这次是真的',
   '天上地下唯此一人',
   '生死不弃',
   '眼泪其实是黏人的胶水',
   '无论怎么样 我都要找到你',
   '让我抓住你的灵魂',
   '拥抱的温度 只有你清楚',
   '我找到了 我的真心',
    '没有你 谁在乎明天',
    '世界是假的 但爱是真的',
    '为你 千千万万遍',
    '天赐这般憾恨机缘 我自不肯休',
    '时也，命也',
    '你的掌纹里也有我的命运',
    '哪怕占据你心脏十分之一',
    '世界好大',
    '我该去哪里找你',
    '天长地久有时尽，此恨绵绵无绝期',
    '我流了三滴泪',
    '一滴名为咎由自取',
    '一滴名为问心无愧',
    '一滴名为物是人非',
    '恨天地生万物而非你我',

    ],
};

// 关闭三维爱心，改成满屏飘雪
const SHOW_HEART = false;

/* ============================================================
 * 1. 基础
 * ============================================================ */
const skyCanvas = document.getElementById('sky');
const skyCtx = skyCanvas.getContext('2d');
const heartCanvas = document.getElementById('heart');
const cardsBox = document.getElementById('cards');
const counterEl = document.getElementById('counter');
const stopBtn = document.getElementById('stop');
const hintEl = document.getElementById('hint');

const TAU = Math.PI * 2;
const rand = (a = 1, b = 0) => b + Math.random() * (a - b);

let W = 0, H = 0, DPR = 1;
let cx = 0, cy = 0, heartScale = 200;

function layout() {
  W = window.innerWidth;
  H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);

  for (const c of [skyCanvas, heartCanvas]) {
    c.width = Math.round(W * DPR);
    c.height = Math.round(H * DPR);
    c.style.width = W + 'px';
    c.style.height = H + 'px';
  }
  skyCtx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const portrait = H > W;
  // 手机竖屏：爱心放在上半屏，卡片在下半屏，互不遮挡
  heartScale = Math.min(H * (portrait ? 0.235 : 0.25), W * 0.35);
  cx = W / 2;
  cy = H * (portrait ? 0.28 : 0.37);

  makeStars();
  makeBed();
  makeSnow();
}

/* ============================================================
 * 2. 三维心形点云（和 Python 版同一套算法）
 * ============================================================ */
function heartF(x, y, z) {
  const a = x * x + 2.25 * y * y + z * z - 1;
  return a * a * a - x * x * z * z * z - 0.1125 * y * y * z * z * z;
}

function insideProjection(x, z) {
  const a = x * x + z * z - 1;
  return a * a * a - x * x * z * z * z < 0;
}

// 给定 (x,z)，二分求出表面处的 y²
function surfaceY2(x, z) {
  const a = x * x + z * z - 1;
  const c0 = -x * x * z * z * z;
  const cz = -0.1125 * z * z * z;
  const g = (s) => {
    const t = a + 2.25 * s;
    return t * t * t + c0 + cz * s;
  };
  let lo = 0, hi = 1;
  for (let i = 0; i < 4 && g(hi) < 0; i++) hi *= 1.6;
  for (let i = 0; i < 28; i++) {
    const mid = (lo + hi) * 0.5;
    if (g(mid) > 0) hi = mid; else lo = mid;
  }
  return hi;
}

function normalAt(x, y, z) {
  const a = x * x + 2.25 * y * y + z * z - 1;
  const a2 = a * a;
  const gx = 6 * x * a2 - 2 * x * z * z * z;
  const gy = 13.5 * y * a2 - 0.225 * y * z * z * z;
  const gz = 6 * z * a2 - 3 * x * x * z * z - 0.3375 * y * y * z * z;
  const l = Math.sqrt(gx * gx + gy * gy + gz * gz) || 1;
  return [gx / l, gy / l, gz / l];
}

const PALETTE = [
  [1.00, 1.00, 1.00],
  [0.93, 0.97, 1.00],
  [0.84, 0.92, 1.00],
  [0.76, 0.87, 1.00],
  [0.98, 0.99, 1.00],
];
const PALETTE_W = [0.40, 0.26, 0.16, 0.10, 0.08];

function pickPalette() {
  let r = Math.random(), acc = 0;
  for (let i = 0; i < PALETTE_W.length; i++) {
    acc += PALETTE_W[i];
    if (r <= acc) return PALETTE[i];
  }
  return PALETTE[0];
}

function buildHeart(count) {
  const pos = [], nrm = [], col = [], meta = [], start = [];
  const nInner = Math.floor(count * 0.18);
  const nShell = count - nInner;
  const half = Math.floor(nShell / 2);

  function push(x, y, z, inner) {
    pos.push(x, y, z - 0.135);

    if (inner) {
      nrm.push(0, 0, 0);
    } else {
      const n = normalAt(x, y, z);
      nrm.push(n[0], n[1], n[2]);
    }

    const c = pickPalette();
    const k = 0.5 + Math.random() * 0.5;
    let r = c[0] * k, g = c[1] * k, b = c[2] * k;
    let bright = 0.4 + Math.random() * 0.5;
    if (Math.random() < 0.08) {
      bright = 0.95 + Math.random() * 0.55;
      if (Math.random() < 0.5) { r = 1; g = 0.88; b = 0.94; }
    }
    col.push(r, g, b);
    meta.push(bright, inner ? 1 : 0, Math.random(), Math.random() * 1.2);

    start.push(
      (Math.random() * 2 - 1) * 1.35,
      (Math.random() * 2 - 1) * 0.5,
      -1.95 - Math.random() * 0.55
    );
  }

  let made = 0;
  while (made < half) {
    const x = Math.random() * 2.24 - 1.12;
    const z = Math.random() * 2.20 - 1.02;
    if (!insideProjection(x, z)) continue;
    const y = Math.sqrt(surfaceY2(x, z));
    push(x, -y, z, false);
    push(x, y, z, false);
    made++;
  }

  let innerMade = 0;
  while (innerMade < nInner) {
    const x = Math.random() * 2.24 - 1.12;
    const y = Math.random() * 2.24 - 1.12;
    const z = Math.random() * 2.24 - 1.12;
    if (heartF(x, y, z) >= 0) continue;
    push(x, y, z, true);
    innerMade++;
  }

  return {
    count: pos.length / 3,
    pos: new Float32Array(pos),
    nrm: new Float32Array(nrm),
    col: new Float32Array(col),
    meta: new Float32Array(meta),
    start: new Float32Array(start),
  };
}

/* ============================================================
 * 3. WebGL 渲染心形
 * ============================================================ */
const HEART_COUNT = Math.min(innerWidth, innerHeight) < 620 ? 9000 : 14000;
let heartData = null;
if (SHOW_HEART) {
  try {
    heartData = buildHeart(HEART_COUNT);
  } catch (err) {
    // 构建失败也不影响后面的雪花 / 卡片
    console.error(err);
  }
}

const VS = `
attribute vec3 aPos;
attribute vec3 aStart;
attribute vec3 aNrm;
attribute vec3 aCol;
attribute vec4 aMeta;

uniform vec2 uRes;
uniform vec2 uCenter;
uniform float uScale;
uniform float uCam;
uniform float uDpr;
uniform float uYaw;
uniform float uPitch;
uniform float uBeat;
uniform float uTime;

varying vec3 vCol;

void main() {
  float prog = clamp((uTime - aMeta.w) / 1.8, 0.0, 1.0);
  float ease = 1.0 - pow(1.0 - prog, 3.0);

  vec3 p = mix(aStart, aPos, ease);
  p.x += sin(prog * 3.14159 * 1.8 + aMeta.z * 6.2831) * 0.35 * (1.0 - ease);
  p *= (1.0 + 0.07 * uBeat);

  float cy = cos(uYaw), sy = sin(uYaw);
  p = vec3(p.x * cy - p.y * sy, p.x * sy + p.y * cy, p.z);

  float cp = cos(uPitch), sp = sin(uPitch);
  p = vec3(p.x, p.y * cp - p.z * sp, p.y * sp + p.z * cp);

  vec3 n = aNrm;
  n = vec3(n.x * cy - n.y * sy, n.x * sy + n.y * cy, n.z);
  n = vec3(n.x, n.y * cp - n.z * sp, n.y * sp + n.z * cp);

  float persp = uCam / (uCam + p.y);
  vec2 scr = uCenter + vec2(p.x * uScale * persp, -p.z * uScale * persp);
  vec2 clip = scr / uRes * 2.0 - 1.0;
  gl_Position = vec4(clip.x, -clip.y, 0.0, 1.0);

  float facing = clamp(-n.y, 0.0, 1.0);
  float cull = clamp(facing * 2.6, 0.0, 1.0);
  float diff = pow(clamp(dot(n, normalize(vec3(-0.66, -0.54, 0.52))), 0.0, 1.0), 1.1);
  float rim = pow(1.0 - facing, 3.0) * 0.35;
  float spec = pow(clamp(dot(n, normalize(vec3(-0.373, -0.870, 0.294))), 0.0, 1.0), 18.0);
  float shade = (0.16 + 1.05 * diff) * cull + (rim + 1.25 * spec) * cull;

  float deep = clamp((p.y + 0.7) / 1.4, 0.0, 1.0);
  float innerGlow = 0.30 * (1.0 - 0.6 * deep);
  shade = mix(shade, innerGlow, aMeta.y);

  float tw = 0.72 + 0.28 * sin(uTime * 3.1 * (0.7 + aMeta.z) + aMeta.z * 6.2831);
  vCol = aCol * aMeta.x * tw * shade * (0.3 + 0.7 * ease);

  gl_PointSize = (6.0 + 6.2 * persp) * uDpr;
}
`;

const FS = `
precision mediump float;
varying vec3 vCol;

void main() {
  vec2 p = gl_PointCoord - vec2(0.5);
  float r = length(p) * 2.0;          // 0..1
  if (r > 1.0) discard;

  float ang = atan(p.y, p.x);
  float arms = pow(abs(cos(3.0 * ang)), 5.0);   // 六条主枝
  float radial = smoothstep(1.0, 0.05, r);
  float core = smoothstep(0.30, 0.03, r);

  float a = clamp(arms * radial * 0.95 + core * 0.55, 0.0, 1.0);
  a *= smoothstep(1.0, 0.88, r);                // 边缘收干净

  gl_FragColor = vec4(vCol * a * 2.1, a);
}
`;

let gl = null;
let glProgram = null;
const glLoc = {};

function compileShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}

function initGL() {
  if (!heartData) return;
  gl = heartCanvas.getContext('webgl', {
    alpha: true,
    premultipliedAlpha: true,
    antialias: true,
    powerPreference: 'high-performance',
  });
  if (!gl) {
    console.warn('WebGL 不可用');
    return;
  }

  const vs = compileShader(gl.VERTEX_SHADER, VS);
  const fs = compileShader(gl.FRAGMENT_SHADER, FS);
  if (!vs || !fs) return;

  glProgram = gl.createProgram();
  gl.attachShader(glProgram, vs);
  gl.attachShader(glProgram, fs);
  gl.linkProgram(glProgram);
  if (!gl.getProgramParameter(glProgram, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(glProgram));
    return;
  }
  gl.useProgram(glProgram);

  const attrs = {
    aPos: heartData.pos,
    aStart: heartData.start,
    aNrm: heartData.nrm,
    aCol: heartData.col,
    aMeta: heartData.meta,
  };
  const sizes = { aPos: 3, aStart: 3, aNrm: 3, aCol: 3, aMeta: 4 };

  for (const name in attrs) {
    const loc = gl.getAttribLocation(glProgram, name);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, attrs[name], gl.STATIC_DRAW);
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, sizes[name], gl.FLOAT, false, 0, 0);
    glLoc[name] = loc;
  }

  for (const name of ['uRes', 'uCenter', 'uScale', 'uCam', 'uDpr', 'uYaw', 'uPitch', 'uBeat', 'uTime']) {
    glLoc[name] = gl.getUniformLocation(glProgram, name);
  }

  gl.clearColor(0, 0, 0, 0);
  gl.disable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.viewport(0, 0, heartCanvas.width, heartCanvas.height);
}

function drawHeart(t) {
  if (!gl || !glProgram) return;

  gl.viewport(0, 0, heartCanvas.width, heartCanvas.height);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(glProgram);

  gl.uniform2f(glLoc.uRes, W, H);
  gl.uniform2f(glLoc.uCenter, cx, cy);
  gl.uniform1f(glLoc.uScale, heartScale);
  gl.uniform1f(glLoc.uCam, 4.2);
  gl.uniform1f(glLoc.uDpr, DPR);
  gl.uniform1f(glLoc.uYaw, 0.62 * Math.sin(t * 0.32) + 0.08 * Math.sin(t * 0.13));
  gl.uniform1f(glLoc.uPitch, 0.10 + 0.07 * Math.sin(t * 0.41 + 0.6));
  gl.uniform1f(glLoc.uBeat, heartbeat(t));
  gl.uniform1f(glLoc.uTime, t);

  gl.drawArrays(gl.POINTS, 0, heartData.count);
}

/* ---------- WebGL 不可用时的兼容渲染 ----------
 * 启动时把爱心预先画到一张贴图上，之后每帧只 drawImage 一次，
 * 低端手机也不会卡。 */
let fbSprite = null;
const FB_SIZE = 340;     // 贴图边长（CSS px）
const FB_SCALE = 125;    // 贴图里模型单位 → 像素

function initFallbackHeart() {
  if (!heartData || fbSprite) return;
  const c = document.createElement('canvas');
  c.width = Math.round(FB_SIZE * DPR);
  c.height = Math.round(FB_SIZE * DPR);
  const g = c.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.globalCompositeOperation = 'lighter';

  const pos = heartData.pos, nrm = heartData.nrm;
  const col = heartData.col, meta = heartData.meta;
  const pitch = 0.10;
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const cxs = FB_SIZE / 2, cys = FB_SIZE / 2;

  for (let i = 0; i < heartData.count; i += 2) {
    const i3 = i * 3, m4 = i * 4;
    const y = pos[i3 + 1], z = pos[i3 + 2];
    const yr = y * cp - z * sp;
    const zr = y * sp + z * cp;

    const nx = nrm[i3], ny = nrm[i3 + 1], nz = nrm[i3 + 2];
    const nyr = ny * cp - nz * sp;
    const nzr = ny * sp + nz * cp;
    const nxr = nx;

    const facing = Math.max(0, -nyr);
    const cull = Math.min(1, facing * 2.6);
    let shade;
    if (meta[m4 + 1] > 0.5) {
      const deep = Math.min(1, Math.max(0, (yr + 0.7) / 1.4));
      shade = 0.30 * (1 - 0.6 * deep);
    } else {
      const dot = Math.max(0, nxr * -0.66 + nyr * -0.54 + nzr * 0.52);
      const diff = Math.pow(dot, 1.1);
      const rim = Math.pow(1 - facing, 3) * 0.35;
      const spec = Math.pow(
        Math.max(0, nxr * -0.373 + nyr * -0.87 + nzr * 0.294), 18
      ) * 1.25;
      shade = (0.16 + 1.05 * diff) * cull + (rim + spec) * cull;
    }
    if (shade < 0.04) continue;

    const persp = 4.2 / (4.2 + yr);
    const sx = cxs + pos[i3] * FB_SCALE * persp;
    const sy = cys - zr * FB_SCALE * persp;

    const f = Math.min(1.5, shade * 1.2);
    const r = Math.min(255, col[i3] * 255 * f) | 0;
    const gg = Math.min(255, col[i3 + 1] * 255 * f) | 0;
    const b = Math.min(255, col[i3 + 2] * 255 * f) | 0;
    g.fillStyle = 'rgb(' + r + ',' + gg + ',' + b + ')';
    g.fillRect(sx - 1.5, sy - 1.5, 3, 3);
  }

  fbSprite = c;
}

function drawHeart2D(ctx, t) {
  if (!fbSprite) return;
  const sc = 1 + 0.07 * heartbeat(t);
  const size = (FB_SIZE / FB_SCALE) * heartScale * sc;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.translate(cx, cy);
  ctx.rotate(0.05 * Math.sin(t * 0.32));
  ctx.drawImage(fbSprite, -size / 2, -size / 2, size, size);
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over';
}

function heartbeat(t) {
  const p = (t * 1.15) % 1;
  return Math.exp(-Math.pow((p - 0.05) / 0.045, 2)) +
         0.55 * Math.exp(-Math.pow((p - 0.22) / 0.06, 2));
}

/* ============================================================
 * 4. 星空、流星、尘埃
 * ============================================================ */
let stars = [];
function makeStars() {
  stars = [];
  const n = Math.max(90, Math.round((W * H) / 7000));
  for (let i = 0; i < n; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.95,
      r: 0.3 + Math.random() * 1.2,
      p: Math.random() * TAU,
      s: 0.4 + Math.random() * 1.4,
    });
  }
}

let bed = [];
function makeBed() {
  bed = [];
  const n = Math.round(Math.min(240, Math.max(80, W * 0.32)));
  for (let i = 0; i < n; i++) {
    bed.push({
      x: Math.random() * W,
      y: H * (0.9 + Math.random() * 0.09),
      r: 0.4 + Math.random() * 1.2,
      p: Math.random() * TAU,
      s: 0.7 + Math.random() * 1.9,
    });
  }
}

/* 满屏飘雪 */
let snow = [];
function makeSnow() {
  snow = [];
  const n = Math.round(Math.min(520, Math.max(150, (W * H) / 1050)));
  for (let i = 0; i < n; i++) {
    const depth = Math.random();
    snow.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 0.7 + depth * 2.6,
      vy: 12 + depth * 58,
      drift: 8 + depth * 22,
      phase: Math.random() * TAU,
      sp: 0.5 + Math.random() * 1.3,
      a: 0.35 + depth * 0.55,
      big: depth > 0.86,
      rot: Math.random() * TAU,
    });
  }
}

const dust = [];
function spawnDust() {
  dust.push({
    x: cx + rand(1, -1) * heartScale * 0.62,
    y: cy + heartScale * (0.9 + Math.random() * 0.25),
    vx: rand(16, -16),
    vy: rand(26, 6),
    life: 0,
    max: rand(3.8, 2.2),
    size: rand(1.3, 0.5),
    c: Math.random() < 0.55
      ? [255, 255, 255]
      : [205, 228, 255],
  });
}

const meteors = [];
let meteorCount = 0;
let showerEnded = false;
let nextMeteorAt = 0.6;
let nextCardIndex = 0;

function spawnMeteor() {
  const speed = rand(1.2, 0.75) * Math.min(W, H) * 1.15;
  meteors.push({
    x: W * rand(1.08, 0.22),
    y: -H * 0.10 + Math.random() * H * 0.30,
    vx: -speed * rand(0.82, 0.55),
    vy: speed * rand(0.72, 0.46),
    tail: rand(0.22, 0.13),
    w: rand(2.6, 1.6),
  });
  meteorCount++;
  spawnCard();
  updateCounter();
}

function updateCounter() {
  if (showerEnded) return;
  if (meteorCount >= CONFIG.total) {
    counterEl.textContent = `故事 · ${meteorCount}/${CONFIG.total} · 结束了`;
  } else {
    counterEl.textContent = `故事进行中 · ${meteorCount}/${CONFIG.total}`;
  }
}

function drawSky(t, dt) {
  const ctx = skyCtx;
  ctx.clearRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';

  /* 星星 */
  for (const s of stars) {
    const a = 0.28 + 0.42 * (0.5 + 0.5 * Math.sin(t * s.s + s.p));
    ctx.fillStyle = `rgba(230,238,255,${a.toFixed(3)})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }

  /* 底部星尘带 */
  for (const s of bed) {
    const a = 0.16 + 0.5 * Math.pow(0.5 + 0.5 * Math.sin(t * s.s + s.p), 2);
    ctx.fillStyle = s.p < 3.14
      ? `rgba(255,255,255,${a.toFixed(3)})`
      : `rgba(205,228,255,${a.toFixed(3)})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, TAU);
    ctx.fill();
  }

  /* 满屏飘雪 */
  for (let i = 0; i < snow.length; i++) {
    const f = snow[i];
    f.y += f.vy * dt;
    f.x += Math.sin(t * f.sp + f.phase) * f.drift * dt + 4 * dt;
    if (f.y > H + 14) { f.y = -14; f.x = Math.random() * W; }
    if (f.x > W + 14) f.x = -14;
    if (f.x < -14) f.x = W + 14;

    if (f.big) {
      // 大一点的雪花画成六角形
      const r = f.r * 2.4;
      ctx.strokeStyle = `rgba(255,255,255,${f.a.toFixed(2)})`;
      ctx.lineWidth = 1;
      for (let k = 0; k < 3; k++) {
        const ang = Math.PI * k / 3 + t * 0.15 + f.rot;
        ctx.beginPath();
        ctx.moveTo(f.x - Math.cos(ang) * r, f.y - Math.sin(ang) * r);
        ctx.lineTo(f.x + Math.cos(ang) * r, f.y + Math.sin(ang) * r);
        ctx.stroke();
      }
      for (let k = 0; k < 6; k++) {
        const ang = Math.PI * k / 3 + t * 0.15 + f.rot;
        const bx = f.x + Math.cos(ang) * r * 0.62;
        const by = f.y + Math.sin(ang) * r * 0.62;
        for (let sd = -1; sd <= 1; sd += 2) {
          const a2 = ang + sd * 0.9;
          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.lineTo(bx + Math.cos(a2) * r * 0.3, by + Math.sin(a2) * r * 0.3);
          ctx.stroke();
        }
      }
    } else {
      ctx.fillStyle = `rgba(255,255,255,${f.a.toFixed(2)})`;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, TAU);
      ctx.fill();
    }
  }

  /* 流星生成 */
  if (!showerEnded && meteorCount < CONFIG.total && t > nextMeteorAt) {
    spawnMeteor();
    nextMeteorAt = t + rand(1.45, 0.75);
  }

  /* 流星绘制 */
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.x += m.vx * dt;
    m.y += m.vy * dt;

    const tx = m.x - m.vx * m.tail;
    const ty = m.y - m.vy * m.tail;

    const grad = ctx.createLinearGradient(m.x, m.y, tx, ty);
    grad.addColorStop(0, 'rgba(255,246,214,0.98)');
    grad.addColorStop(0.15, 'rgba(255,220,150,0.72)');
    grad.addColorStop(0.55, 'rgba(255,196,105,0.28)');
    grad.addColorStop(1, 'rgba(255,190,90,0)');

    ctx.strokeStyle = grad;
    ctx.lineWidth = m.w;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(m.x, m.y);
    ctx.lineTo(tx, ty);
    ctx.stroke();

    // 头部亮点
    ctx.fillStyle = 'rgba(255,248,225,0.98)';
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.w * 0.9, 0, TAU);
    ctx.fill();

    if (m.x < -W * 0.2 || m.y > H * 1.2) meteors.splice(i, 1);
  }

  ctx.globalCompositeOperation = 'source-over';
}

/* ============================================================
 * 5. 专属提示卡片
 * ============================================================ */
var BANNER_SRC = "scroll.webp";

function cardWidth() {
  return Math.min(W * 0.96, 440);
}

function spawnCard() {
  while (cardsBox.children.length >= CONFIG.cardLimit) {
    cardsBox.removeChild(cardsBox.firstElementChild);
  }

  const msg = CONFIG.messages[nextCardIndex % CONFIG.messages.length]
    .replace(/\{name\}/g, CONFIG.name);
  nextCardIndex++;

  const el = document.createElement('div');
  el.className = 'card v' + Math.floor(Math.random() * 3);

  const portrait = H > W;
  const width = cardWidth();
  // 固定的一叠卡片：5 个槽位循环，向下错开排列
  const slot = nextCardIndex % CONFIG.cardLimit;
  const baseLeft = W * 0.5 - width * 0.5;
  const drift = [0, -0.10, 0.07, -0.045, 0.05][slot] * width;
  const left = Math.round(baseLeft + drift);
  const top = H * ((portrait ? 0.485 : 0.445) + slot * (portrait ? 0.05 : 0.055));

  el.style.width = width + 'px';
  el.style.left = Math.max(6, Math.min(W - width - 6, left)) + 'px';
  el.style.top = top + 'px';
  el.style.setProperty('--rot', [0.8, -2.4, 1.6, -1.2, 2.2][slot] + 'deg');
  el.style.zIndex = String(10 + (nextCardIndex % 900));

  el.innerHTML =
    '<img class="card-banner" src="' + BANNER_SRC + '" alt="">' +
    '<div class="card-text">' + msg + '</div>' +
    '<button class="close" aria-label="关闭">×</button>';

  el.querySelector('.close').addEventListener('click', (e) => {
    e.stopPropagation();
    el.remove();
  });

  cardsBox.appendChild(el);

  // 别让卡片压到底部的计数器 / 按钮
  const rect = el.getBoundingClientRect();
  const limitY = H - 86;
  if (rect.bottom > limitY) {
    el.style.top = Math.max(H * 0.30, top - (rect.bottom - limitY) - 4) + 'px';
  }
}

/* ============================================================
 * 6. 交互
 * ============================================================ */
stopBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (showerEnded) return;
  showerEnded = true;
  stopBtn.classList.add('hidden');
  counterEl.textContent = `流星雨 · ${meteorCount}/${CONFIG.total} · 已结束`;
  hintEl.classList.add('hidden');

  const el = document.createElement('div');
  el.className = 'card v1';
  const width = cardWidth();
  el.style.width = width + 'px';
  el.style.left = Math.round((W - width) / 2) + 'px';
  el.style.top = H * 0.44 + 'px';
  el.style.setProperty('--rot', '-2deg');
  el.style.zIndex = '999';
  el.innerHTML =
    '<img class="card-banner" src="' + BANNER_SRC + '" alt="">' +
    '<div class="card-text">淮朝，我好想你</div>' +
    '<button class="close" aria-label="关闭">×</button>';
  el.querySelector('.close').addEventListener('click', (ev) => {
    ev.stopPropagation();
    el.remove();
  });
  cardsBox.appendChild(el);
});

// 点屏幕空白处：再下一颗流星 + 一张卡片
window.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.card') || e.target.closest('.btn')) return;
  if (showerEnded || meteorCount >= CONFIG.total) return;
  spawnMeteor();
});

setTimeout(() => hintEl.classList.add('hidden'), 6000);
window.addEventListener('resize', layout);

/* ============================================================
 * 7. 背景音乐（内嵌 MP3，点击后播放）
 * ============================================================ */
const bgm = document.getElementById('bgm');
const soundBtn = document.getElementById('sound');
bgm.volume = 0.55;

let bgmStarted = false;
let bgmMuted = false;

function paintSound() {
  if (!bgmStarted || bgmMuted) {
    soundBtn.textContent = bgmStarted ? '🔇' : '🎵';
    soundBtn.classList.remove('on');
    soundBtn.setAttribute('aria-label', '开启背景音乐');
  } else {
    soundBtn.textContent = '🔊';
    soundBtn.classList.add('on');
    soundBtn.setAttribute('aria-label', '关闭背景音乐');
  }
}

function playBgm() {
  const p = bgm.play();
  if (p && p.catch) p.catch(function () {});
}

soundBtn.addEventListener('click', function (e) {
  e.stopPropagation();
  if (!bgmStarted) {
    bgmStarted = true;
    bgmMuted = false;
    playBgm();
  } else if (bgm.paused) {
    bgmMuted = false;
    playBgm();
  } else {
    bgmMuted = true;
    bgm.pause();
  }
  setTimeout(paintSound, 0);
});

function onGesture(e) {
  if (e && e.target && e.target.closest && e.target.closest('#sound')) return;
  if (!bgmStarted) bgmStarted = true;
  if (!bgmMuted && bgm.paused) playBgm();
  setTimeout(paintSound, 0);
}
window.addEventListener('pointerdown', onGesture, { passive: true });
window.addEventListener('touchend', onGesture, { passive: true });

bgm.addEventListener('play', paintSound);
bgm.addEventListener('pause', paintSound);

document.addEventListener('visibilitychange', function () {
  if (document.hidden && !bgm.paused) bgm.pause();
});

paintSound();

/* ============================================================
 * 8. 启动（任何一步失败都不影响其它部分）
 * ============================================================ */
const bootEl = document.getElementById('boot');
const errEl = document.getElementById('err');
let errShown = '';

function showError(err) {
  const msg = err && err.message ? err.message : String(err || '未知错误');
  if (!errEl || msg === errShown) return;
  errShown = msg;
  errEl.textContent = '加载出错：' + msg;
  errEl.classList.add('show');
}

window.addEventListener('error', (e) => showError(e.error || e.message));

try {
  layout();
} catch (err) {
  showError(err);
}

let webglOK = false;
if (SHOW_HEART && !/[?&]nogl=1/.test(location.search)) {
  try {
    initGL();
    webglOK = !!(gl && glProgram);
  } catch (err) {
    // 某些手机浏览器会直接抛错，这里静默切到 2D 兼容渲染
    console.warn('WebGL 初始化失败，使用兼容渲染', err);
  }
}

if (!SHOW_HEART) {
  heartCanvas.style.display = 'none';
} else if (!webglOK) {
  heartCanvas.style.display = 'none';
  try {
    initFallbackHeart();
  } catch (err) {
    console.error(err);
  }
}

let lastTime = performance.now();
const startTime = lastTime;
let booted = false;

function hideBoot() {
  if (bootEl) bootEl.classList.add('hide');
}

function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  const t = (now - startTime) / 1000;

  try {
    drawSky(t, dt);
  } catch (err) {
    showError(err);
  }

  if (SHOW_HEART) {
    try {
      if (webglOK) {
        drawHeart(t);
      } else {
        drawHeart2D(skyCtx, t);
      }
    } catch (err) {
      // WebGL 画到一半失败：退到 2D，页面继续动
      console.warn('爱心的 WebGL 渲染失败，切换兼容渲染', err);
      webglOK = false;
      heartCanvas.style.display = 'none';
      try { initFallbackHeart(); } catch (e) {}
      try { drawHeart2D(skyCtx, t); } catch (e) {}
    }
  }

  if (!booted) {
    booted = true;
    hideBoot();
  }
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
setTimeout(hideBoot, 4000);
</script>
